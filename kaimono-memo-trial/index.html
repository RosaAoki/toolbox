<html lang="ja">
<head>
<meta charset="utf-8">

<style>
:root{
  --kb:0px;
  --accent:#b7791f; --accent-soft:#f7ecd4; --ink:#26221c; --sub:#7a7264;
  --line:#e5ddcb; --bg:#fffdf7; --card:#ffffff; --danger:#b3382e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:0 14px calc(20px + env(safe-area-inset-bottom));}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.45}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;z-index:5}
h1{font-size:19px;margin:0 0 8px}
h1 .badge{font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:2px 6px;vertical-align:3px;margin-left:6px}
nav.main{display:flex;gap:6px;flex-wrap:wrap}
nav.main button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.tabs button{white-space:nowrap;border-radius:999px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;position:sticky;top:calc(100px + env(safe-area-inset-top));z-index:4}
.notice:empty{display:none}
section.frame{margin-top:14px}
section.frame h2{font-size:15px;margin:0 0 6px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:stretch;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:6px 8px 6px 4px;margin-bottom:8px}
.check{flex:0 0 48px;display:flex;align-items:center;justify-content:center}
.check input{width:28px;height:28px;accent-color:var(--accent)}
.item-main{flex:1;min-width:0;text-align:left;border:none;background:none;padding:6px 4px;min-height:44px}
.item-name{font-size:17px;word-break:break-word}
.item-memo{font-size:13px;color:var(--sub);word-break:break-word;margin-top:2px}
.move-btns{display:flex;flex-direction:column;gap:4px;justify-content:center}
.move-btns button{min-height:44px;min-width:44px;padding:2px 8px}
.empty{color:var(--sub);font-size:14px;padding:8px 2px}
form.add{display:flex;flex-direction:column;gap:6px;margin-top:8px}
form.add .row{display:flex;gap:6px}
form.add input[type="text"]{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);min-width:0}
form.add input.memo{font-size:14px}
.addbar{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,100%);bottom:var(--kb);background:var(--bg);padding:10px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:15}
body.has-addbar{padding-bottom:calc(138px + env(safe-area-inset-bottom))}
.undobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kb) + 14px + env(safe-area-inset-bottom));
  width:min(412px,calc(100% - 28px));background:#33302a;color:#fff;border-radius:12px;
  display:none;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;z-index:20;font-size:14px}
body.has-addbar .undobar{bottom:calc(var(--kb) + 146px + env(safe-area-inset-bottom))}
.undobar.show{display:flex}
.barnotice{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kb) + 146px + env(safe-area-inset-bottom));
  width:min(412px,calc(100% - 28px));background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);
  border-radius:12px;display:none;padding:10px 14px;z-index:19;font-size:14px}
.barnotice.show{display:block}
body.undo-on .barnotice{bottom:calc(var(--kb) + 214px + env(safe-area-inset-bottom))}
.undobar button{background:#fff;color:#26221c;border:none;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:15px}
.card p{font-size:14px;line-height:1.6}
.small{font-size:12px;color:var(--sub)}
.hist-date{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.hist-item{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.hist-item .grow{flex:1;min-width:0}
dialog{border:1px solid var(--line);border-radius:14px;padding:16px;width:min(400px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
dialog input[type="text"],dialog select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
dialog .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.kv{font-size:14px;line-height:1.9}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="apptitle">買い物メモ</h1>
  <nav class="main" aria-label="画面切り替え">
    <button type="button" data-view="main" aria-pressed="true">リスト</button>
    <button type="button" data-view="staples" aria-pressed="false">定番</button>
    <button type="button" data-view="history" aria-pressed="false">買ったもの</button>
    <button type="button" data-view="settings" aria-pressed="false">設定</button>
  </nav>
</header>

<div id="notice" class="notice" role="status" aria-live="polite"></div>
<main id="app"></main>

<div id="barnotice" class="barnotice" role="status" aria-live="polite"></div>

<div id="undobar" class="undobar">
  <span id="undotext"></span>
  <button type="button" id="undobtn">戻す</button>
</div>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h3 style="margin:0">品目を編集</h3>
    <label for="ed-name">名前</label>
    <input type="text" id="ed-name" autocomplete="off">
    <label for="ed-memo">メモ（個数や条件など）</label>
    <input type="text" id="ed-memo" autocomplete="off">
    <label for="ed-frame">置き場所</label>
    <select id="ed-frame"></select>
    <div class="row">
      <button type="button" id="ed-save" class="primary">保存</button>
      <button type="button" id="ed-staple">定番に入れる</button>
      <button type="button" id="ed-delete" class="danger">削除</button>
      <button type="button" id="ed-close" class="ghost">閉じる</button>
    </div>
    <p class="small" id="ed-msg" role="status"></p>
  </form>
</dialog>

<script>
"use strict";
/* ===== 設定（試作と本番で違うのは、CONFIG の3点と、manifest とアイコンのファイルだけ） ===== */
const CONFIG = {
  storageKey: "kaimono-memo-trial:v1",   // 保存キー
  appName: "買い物メモ（試作）",          // アプリ名（タブやホーム画面の名前）
  badge: "試作"                           // 見出しのバッジ（本番は "" ）
};
const APP_MARK = "kaimono-memo";
const $app = document.getElementById("app");
const $notice = document.getElementById("notice");
const SCHEMA = 1;
const ANYWHERE = "anywhere";
const DAY = 86400000;

/* ===== データ ===== */
function defaultData(){
  return { schemaVersion: SCHEMA, stores: [], items: [], staples: [],
           orderMemory: {}, history: [], meta: { lastExportAt: null } };
}
function retreatKey(kind){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  let base = CONFIG.storageKey + ":" + kind + "-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  let key = base, i = 2;
  while (localStorage.getItem(key) !== null){ key = base + "-" + (i++); }
  return key;
}
function isStr(x){ return typeof x === "string"; }
function validateData(d){
  if (!d || typeof d !== "object" || Array.isArray(d)) return false;
  if (d.schemaVersion !== SCHEMA) return false;
  if (!Array.isArray(d.stores) || !Array.isArray(d.items) || !Array.isArray(d.staples) || !Array.isArray(d.history)) return false;
  if (!d.orderMemory || typeof d.orderMemory !== "object" || Array.isArray(d.orderMemory)) return false;
  const storeIds = new Set();
  for (const s of d.stores){ if (!s || !isStr(s.id) || !s.id || !isStr(s.name)) return false; storeIds.add(s.id); }
  const frameOk = f => f === ANYWHERE || storeIds.has(f);
  for (const i of d.items){ if (!i || !isStr(i.id) || !isStr(i.name) || !i.name || !frameOk(i.frame)) return false; if (i.memo !== undefined && !isStr(i.memo)) return false; }
  for (const s of d.staples){ if (!s || !isStr(s.id) || !isStr(s.name) || !frameOk(s.frame)) return false; if (s.memo !== undefined && !isStr(s.memo)) return false; }
  for (const h of d.history){
    if (!h || !isStr(h.name) || typeof h.checkedAt !== "number") return false;
    if (!h.frame || (h.frame.type !== "anywhere" && h.frame.type !== "store")) return false;
    if (h.frame.type === "store" && !isStr(h.frame.id)) return false;
    if (h.memo !== undefined && h.memo !== null && !isStr(h.memo)) return false;
  }
  for (const k of Object.keys(d.orderMemory)){ const a = d.orderMemory[k]; if (!Array.isArray(a) || !a.every(isStr)) return false; }
  if (d.meta !== undefined){
    if (!d.meta || typeof d.meta !== "object" || Array.isArray(d.meta)) return false;
    if (d.meta.lastExportAt !== undefined && d.meta.lastExportAt !== null && typeof d.meta.lastExportAt !== "number") return false;
  }
  return true;
}
let recoveredFromCorrupt = false;
function load(){
  let raw = null;
  try { raw = localStorage.getItem(CONFIG.storageKey); } catch(e){}
  if (!raw) return defaultData();
  try {
    const d = JSON.parse(raw);
    if (!validateData(d)) throw new Error("shape");
    d.meta = (d.meta && typeof d.meta === "object") ? d.meta : { lastExportAt: null };
    if (!("lastExportAt" in d.meta)) d.meta.lastExportAt = null;
    return d;
  } catch(e){
    recoveredFromCorrupt = true;
    try { localStorage.setItem(retreatKey("corrupt"), raw); } catch(e2){}
    return defaultData();
  }
}
let data = load();
function save(){
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(data)); return true; }
  catch(e){ notice("保存できませんでした。空き容量やブラウザの設定を確認してください"); return false; }
}
if (navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
// 起動時：90日を過ぎた履歴を掃除
(function cleanup(){
  const before = data.history.length, cut = Date.now() - 90*DAY;
  data.history = data.history.filter(h => h.checkedAt > cut);
  if (data.history.length !== before) save();
})();

/* ===== 小物 ===== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => (s||"").trim().replace(/\s+/g," ");
const esc = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notice(msg){ $notice.textContent = msg || ""; if (msg) setTimeout(()=>{ if ($notice.textContent === msg) $notice.textContent=""; }, 6000); }
let barNoticeTimer = null;
function barNotice(msg){
  const el = document.getElementById("barnotice");
  el.textContent = msg || "";
  el.classList.add("show");
  clearTimeout(barNoticeTimer);
  barNoticeTimer = setTimeout(()=> el.classList.remove("show"), 6000);
}
function fmtDate(ts){
  const d = new Date(ts);
  return (d.getMonth()+1) + "月" + d.getDate() + "日";
}
function daysAgo(ts){
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(ts); b.setHours(0,0,0,0);
  return Math.round((a - b) / DAY);
}
function storeById(id){ return data.stores.find(s => s.id === id) || null; }
function frameLabel(frame){
  if (frame === ANYWHERE) return "どこでも";
  const s = storeById(frame); return s ? s.name : "（削除された店）";
}

/* ===== 並び（orderMemory が正） ===== */
function orderArr(frame){ return data.orderMemory[frame] || (data.orderMemory[frame] = []); }
function ensureOrder(frame, name){ const a = orderArr(frame); if (!a.includes(name)) a.push(name); }
function orderedItems(frame){
  const inFrame = data.items.filter(i => i.frame === frame);
  const byName = new Map(inFrame.map(i => [i.name, i]));
  const out = [];
  for (const n of orderArr(frame)){ if (byName.has(n)){ out.push(byName.get(n)); byName.delete(n); } }
  for (const i of byName.values()) out.push(i);
  return out;
}
function moveInOrder(frame, name, dir){
  const visible = orderedItems(frame).map(i => i.name);
  const vi = visible.indexOf(name);
  if (vi < 0) return;
  const neighbor = dir < 0 ? visible[vi-1] : visible[vi+1];
  if (neighbor === undefined) return;
  const a = orderArr(frame);
  for (const n of visible){ if (!a.includes(n)) a.push(n); }
  a.splice(a.indexOf(name), 1);
  const ni = a.indexOf(neighbor);
  a.splice(dir < 0 ? ni : ni+1, 0, name);
}

/* ===== 状態 ===== */
let view = "main";
let currentStore = data.stores.length ? data.stores[0].id : null;
let reorderMode = false;
let stapleFrame = ANYWHERE;
let resetFrame = ANYWHERE;
let focusFrame = null;

/* ===== 品目の操作 ===== */
function crossNotice(frame, name, tail){
  tail = tail || "そのまま追加しました";
  const inAnywhere = data.items.some(i => i.frame === ANYWHERE && i.name === name);
  const inStore = data.items.some(i => i.frame !== ANYWHERE && i.name === name);
  if (frame === ANYWHERE && inStore) return "店のリストにも「" + name + "」があります（" + tail + "）";
  if (frame !== ANYWHERE && inAnywhere) return "「どこでも」にも「" + name + "」があります（" + tail + "）";
  return "";
}
function addItem(frame, name, memo, viaBar){
  name = norm(name); memo = (memo||"").trim();
  if (!name) return;
  const dup = data.items.find(i => i.frame === frame && i.name === name);
  if (dup){ openEditor(dup.id, "「" + name + "」はもうリストにあります。メモを編集できます。"); return; }
  data.items.push({ id: uid(), frame, name, memo });
  ensureOrder(frame, name);
  if (view === "main") focusFrame = frame;
  save(); render();
  const c = crossNotice(frame, name);
  const msg = c || "「" + name + "」を追加しました";
  if (viaBar) barNotice(msg); else notice(msg);
}
function checkItem(id){
  const idx = data.items.findIndex(i => i.id === id);
  if (idx < 0) return;
  const it = data.items[idx];
  data.items.splice(idx, 1);
  let frameSnap, bought = null;
  if (it.frame === ANYWHERE){
    frameSnap = { type: "anywhere" };
    if (currentStore && storeById(currentStore)){ const s = storeById(currentStore); bought = { id: s.id, name: s.name }; }
  } else {
    const s = storeById(it.frame);
    frameSnap = { type: "store", id: it.frame, name: s ? s.name : "" };
    bought = s ? { id: s.id, name: s.name } : null;
  }
  const h = { id: uid(), name: it.name, memo: it.memo, frame: frameSnap, boughtStore: bought, checkedAt: Date.now() };
  data.history.unshift(h);
  save(); render();
  showUndo(h);
}
function restoreHistory(hid){
  const idx = data.history.findIndex(h => h.id === hid);
  if (idx < 0) return;
  const h = data.history[idx];
  let target = ANYWHERE;
  if (h.frame.type === "store" && storeById(h.frame.id)) target = h.frame.id;
  data.history.splice(idx, 1);
  if (!data.items.some(i => i.frame === target && i.name === h.name)){
    data.items.push({ id: uid(), frame: target, name: h.name, memo: h.memo });
    ensureOrder(target, h.name);
  }
  save(); render();
  notice("「" + h.name + "」を" + (target === ANYWHERE ? "「どこでも」" : "「" + frameLabel(target) + "」") + "に戻しました");
}
let undoTimer = null;
function showUndo(h){
  const bar = document.getElementById("undobar");
  document.getElementById("undotext").textContent = "「" + h.name + "」を買ったものへ移しました";
  const btn = document.getElementById("undobtn");
  btn.onclick = () => { bar.classList.remove("show"); document.body.classList.remove("undo-on"); restoreHistory(h.id); };
  bar.classList.add("show");
  document.body.classList.add("undo-on");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=> { bar.classList.remove("show"); document.body.classList.remove("undo-on"); }, 6000);
}
/* ===== 描画：共通部品 ===== */
function itemRow(it){
  const li = document.createElement("li");
  if (reorderMode){
    const mv = document.createElement("div"); mv.className = "move-btns";
    const up = document.createElement("button"); up.type="button"; up.textContent="↑"; up.setAttribute("aria-label","上へ");
    up.onclick = () => { moveInOrder(it.frame, it.name, -1); save(); render(); };
    const dn = document.createElement("button"); dn.type="button"; dn.textContent="↓"; dn.setAttribute("aria-label","下へ");
    dn.onclick = () => { moveInOrder(it.frame, it.name, 1); save(); render(); };
    mv.append(up, dn); li.appendChild(mv);
  } else {
    const lab = document.createElement("label"); lab.className = "check";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.setAttribute("aria-label", it.name + "を買った");
    cb.onchange = () => checkItem(it.id);
    lab.appendChild(cb); li.appendChild(lab);
  }
  const main = document.createElement("button"); main.type="button"; main.className="item-main";
  main.innerHTML = '<span class="item-name">' + esc(it.name) + "</span>" + (it.memo ? '<span class="item-memo" style="display:block">' + esc(it.memo) + "</span>" : "");
  main.onclick = () => openEditor(it.id);
  li.appendChild(main);
  return li;
}
function addForm(frame, placeholder){
  const f = document.createElement("form"); f.className = "add"; f.dataset.frame = frame;
  f.innerHTML = '<div class="row"><input type="text" name="name" autocomplete="off" placeholder="' + esc(placeholder) + '" aria-label="品目名">' +
    '<button type="submit" class="primary">追加</button></div>' +
    '<input type="text" name="memo" class="memo" autocomplete="off" placeholder="メモ（任意：個数や条件）" aria-label="メモ">';
  f.onsubmit = e => { e.preventDefault(); addItem(frame, f.elements.name.value, f.elements.memo.value, !!f.closest(".addbar")); };
  return f;
}
function frameSection(frame, title, withForm){
  const sec = document.createElement("section"); sec.className = "frame";
  const h = document.createElement("h2"); h.textContent = title;
  sec.appendChild(h);
  const items = orderedItems(frame);
  if (!items.length){ const p = document.createElement("p"); p.className="empty"; p.textContent = "（まだありません）"; sec.appendChild(p); }
  const ul = document.createElement("ul"); ul.className = "list";
  items.forEach(it => ul.appendChild(itemRow(it)));
  sec.appendChild(ul);
  if (withForm !== false) sec.appendChild(addForm(frame, frame === ANYWHERE ? "どこでも買える品目" : "品目名"));
  return sec;
}

/* ===== 描画：リスト画面 ===== */
function renderMain(){
  const wrap = document.createElement("div");
  const tabs = document.createElement("div"); tabs.className = "tabs";
  data.stores.forEach(s => {
    const b = document.createElement("button"); b.type="button"; b.textContent = s.name;
    b.setAttribute("aria-pressed", s.id === currentStore ? "true" : "false");
    b.onclick = () => { currentStore = s.id; render(); };
    tabs.appendChild(b);
  });
  const mg = document.createElement("button"); mg.type="button"; mg.textContent = "店の管理";
  mg.onclick = () => { view = "stores"; syncNav(); render(); };
  tabs.appendChild(mg);
  wrap.appendChild(tabs);

  const tools = document.createElement("div"); tools.style.margin = "6px 0";
  const rt = document.createElement("button"); rt.type="button";
  rt.textContent = reorderMode ? "並べ替えを終わる" : "並べ替える";
  rt.setAttribute("aria-pressed", reorderMode ? "true" : "false");
  rt.onclick = () => { reorderMode = !reorderMode; render(); };
  tools.appendChild(rt);
  wrap.appendChild(tools);

  let hasBar = false;
  if (currentStore && storeById(currentStore)){
    wrap.appendChild(frameSection(currentStore, storeById(currentStore).name, false));
    const bar = document.createElement("div"); bar.className = "addbar";

function renderStores(){
  const wrap = document.createElement("div");
  const back = document.createElement("button"); back.type="button"; back.textContent = "← リストへ戻る";
  back.onclick = () => { view = "main"; syncNav(); render(); };

  f.onsubmit = e => {
    e.preventDefault();
    const name = norm(f.elements.name.value);
    if (!name) return;
    if (data.stores.some(s => norm(s.name) === name)){ notice("同じ名前の店があります"); return; }
    const s = { id: uid(), name };
    data.stores.push(s); if (!currentStore) currentStore = s.id;
    save(); render(); notice("店「" + name + "」を追加しました");
  };

  data.stores.forEach((s, i) => {
    const c = document.createElement("div"); c.className = "card";
    const title = document.createElement("h3"); title.textContent = s.name; c.appendChild(title);
    const row = document.createElement("div"); row.style.display="flex"; row.style.gap="6px"; row.style.flexWrap="wrap";
    const up = document.createElement("button"); up.type="button"; up.textContent="← 前へ"; up.disabled = i===0;
    up.onclick = () => { data.stores.splice(i,1); data.stores.splice(i-1,0,s); save(); render(); };
    const dn = document.createElement("button"); dn.type="button"; dn.textContent="次へ →"; dn.disabled = i===data.stores.length-1;
    dn.onclick = () => { data.stores.splice(i,1); data.stores.splice(i+1,0,s); save(); render(); };
    const ren = document.createElement("button"); ren.type="button"; ren.textContent="名前を変える";
    ren.onclick = () => {
      const name = norm(prompt("新しい店名", s.name) || "");
      if (!name || name === s.name) return;
      if (data.stores.some(x => x.id !== s.id && norm(x.name) === name)){ notice("同じ名前の店があります"); return; }
      s.name = name; save(); render();
    };
    const del = document.createElement("button"); del.type="button"; del.textContent="この店を消す"; del.className="danger";
    del.onclick = () => {
      if (!confirm("店「" + s.name + "」を消します。その店のリスト・定番・並びの記憶も一緒に消えます（買ったものの履歴は残ります）。よろしいですか？")) return;
      data.items = data.items.filter(x => x.frame !== s.id);
      data.staples = data.staples.filter(x => x.frame !== s.id);
      delete data.orderMemory[s.id];
      data.stores = data.stores.filter(x => x.id !== s.id);
      if (currentStore === s.id) currentStore = data.stores.length ? data.stores[0].id : null;
      save(); render(); notice("店「" + s.name + "」を消しました");
    };
    row.append(up, dn, ren, del); c.appendChild(row); wrap.appendChild(c);
  });
  $app.replaceChildren(wrap);
}

/* ===== 書き出し／読み込み ===== */
function download(filename, text){
  const blob = new Blob([text], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}
async function exportJSON(){
  const now = new Date(), p = n => String(n).padStart(2,"0");
  const payload = { app: APP_MARK, schemaVersion: SCHEMA, exportedAt: now.toISOString(), data };
  const text = JSON.stringify(payload, null, 2);
  const fname = "kaimono-memo-backup-" + now.getFullYear() + p(now.getMonth()+1) + p(now.getDate()) + ".json";
  let handed = false;
  try {
    const file = new File([text], fname, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file] });
      handed = true;
    }
  } catch(e){
    if (e && e.name === "AbortError"){ notice("書き出しをやめました"); return; }
  }
  if (!handed){ download(fname, text); handed = true; }
  data.meta.lastExportAt = now.getTime(); save();
  notice("書き出しました。iCloud Drive の専用フォルダに保存しておいてください");
  render();
}
let pendingImport = null;
function handleImportFile(file){
  file.text().then(text => {
    let obj;
    try { obj = JSON.parse(text); } catch(e){ notice("読み込めませんでした：ファイルが壊れているようです"); return; }
    if (!obj || obj.app !== APP_MARK || !obj.data){ notice("読み込めませんでした：買い物メモのファイルではないようです"); return; }
    if (typeof obj.schemaVersion !== "number" || obj.schemaVersion > SCHEMA){ notice("読み込めませんでした：ファイルの形式がこのアプリより新しい版です"); return; }
    const d = obj.data;
    if (!validateData(d)){ notice("読み込めませんでした：中身の形が合いません"); return; }
    pendingImport = { obj, text };
    render();
    notice("読み込みの確認を表示しました");
  }).catch(()=> notice("読み込めませんでした"));
}
function doImport(){
  if (!pendingImport) return;
  const raw = localStorage.getItem(CONFIG.storageKey);
  if (raw !== null){
    try { localStorage.setItem(CONFIG.storageKey + ":before-import", raw); localStorage.setItem(CONFIG.storageKey + ":import-undo", "1"); }
    catch(e){ notice("読み込み前の退避ができなかったため、読み込みをやめました"); return; }
  }
  const d = pendingImport.obj.data;
  data = Object.assign(defaultData(), d);
  data.schemaVersion = SCHEMA;
  pendingImport = null;
  currentStore = data.stores.length ? data.stores[0].id : null;
  save(); render();
  notice("読み込みました。設定から1回だけ取り消せます");
}
function undoImport(){
  const raw = localStorage.getItem(CONFIG.storageKey + ":before-import");
  if (raw === null) return;
  try { data = JSON.parse(raw); } catch(e){ notice("取り消し用のデータが読めませんでした"); return; }
  localStorage.removeItem(CONFIG.storageKey + ":before-import");
  localStorage.removeItem(CONFIG.storageKey + ":import-undo");
  currentStore = data.stores.length ? data.stores[0].id : null;
  save(); render();
  notice("読み込みを取り消しました");
}
function ownRetreatKeys(){
  const prefix = CONFIG.storageKey + ":", out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.startsWith(prefix) && k !== CONFIG.storageKey + ":import-undo") out.push(k);
  }
  return out.sort();
}

/* ===== 編集ダイアログ ===== */
const dlg = document.getElementById("editor");
let editingId = null;
function openEditor(id, reason){
  const it = data.items.find(i => i.id === id);
  if (!it) return;
  editingId = id;
  document.getElementById("ed-name").value = it.name;
  document.getElementById("ed-memo").value = it.memo || "";
  document.getElementById("ed-msg").textContent = reason || "";
  const sel = document.getElementById("ed-frame");
  sel.replaceChildren();
  [ANYWHERE, ...data.stores.map(s => s.id)].forEach(fr => {
    const o = document.createElement("option"); o.value = fr; o.textContent = frameLabel(fr);
    if (fr === it.frame) o.selected = true;
    sel.appendChild(o);
  });
  dlg.showModal();
  const closeBtn = document.getElementById("ed-close");
  if (closeBtn) closeBtn.focus({ preventScroll: true });
}
document.getElementById("ed-close").onclick = () => dlg.close();
document.getElementById("ed-save").onclick = () => {
  const it = data.items.find(i => i.id === editingId);
  if (!it) { dlg.close(); return; }
  const name = norm(document.getElementById("ed-name").value);
  const memo = document.getElementById("ed-memo").value.trim();
  const target = document.getElementById("ed-frame").value;
  const msg = document.getElementById("ed-msg");
  if (!name){ msg.textContent = "名前が空です"; return; }
  if (data.items.some(i => i.id !== it.id && i.frame === target && i.name === name)){
    msg.textContent = "「" + name + "」はもうリストにあります"; return;
  }
  const oldFrame = it.frame, oldName = it.name;
  if (target === oldFrame && name !== oldName){
    const a = orderArr(oldFrame), idx = a.indexOf(oldName);
    if (idx >= 0){
      if (a.includes(name)) a.splice(idx, 1); else a[idx] = name;
    } else ensureOrder(oldFrame, name);
  }
  if (target !== oldFrame){
    // 移動：元の枠の配列には名前を残し（記憶）、移動先の配列へ末尾に足す
    ensureOrder(target, name);
  } else if (name !== oldName){
    // 上で処理済み
  }
  it.name = name; it.memo = memo; it.frame = target;
  save(); dlg.close(); render();
  const cross = (target !== oldFrame) ? crossNotice(target, name, "そのまま移動しました") : "";
  notice(cross || "保存しました");
};
document.getElementById("ed-delete").onclick = () => {
  data.items = data.items.filter(i => i.id !== editingId);
  save(); dlg.close(); render(); notice("削除しました");
};
document.getElementById("ed-staple").onclick = () => {
  const it = data.items.find(i => i.id === editingId);
  if (!it) return;
  if (data.staples.some(s => s.frame === it.frame && s.name === it.name)){
    document.getElementById("ed-msg").textContent = "もう定番に入っています"; return;
  }
  data.staples.push({ id: uid(), frame: it.frame, name: it.name, memo: it.memo });
  save();
  document.getElementById("ed-msg").textContent = "定番に入れました";
};

/* キーボードの高さに常駐バーを追随させる（g1） */
function syncKb(){
  const vv = window.visualViewport;
  let kb = 0;
  if (vv) kb = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  document.documentElement.style.setProperty("--kb", kb + "px");
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", syncKb);
  window.visualViewport.addEventListener("scroll", syncKb);
}
syncKb();
/* キーボードの開閉が落ち着くまで、少し置いてから合わせ直す（p1） */
function syncKbSoon(){ syncKb(); setTimeout(syncKb, 60); setTimeout(syncKb, 300); }
document.addEventListener("focusin", syncKbSoon);
document.addEventListener("focusout", syncKbSoon);
/* 常駐バーで入力中に、バーの外を指でなぞったらキーボードを閉じる（ろーさ決定） */
document.addEventListener("touchmove", e => {
  const ae = document.activeElement;
  if (!ae) return;
  const bar = document.querySelector(".addbar");
  if (!bar || !bar.contains(ae)) return;
  if (e.target && bar.contains(e.target)) return;
  ae.blur();
}, { passive: true });
render();
if (recoveredFromCorrupt) notice("保存データが壊れていたため、退避して空で起動しました。退避データは設定から書き出せます");
</script>
</body>
</html>
